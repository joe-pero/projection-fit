[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "projection-fit"
version = "1.0.0"
description = "Fit projected video onto a real surface from one photo of an ArUco marker card"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Joe Pero"}]
requires-python = ">=3.9"
dependencies = ["opencv-python>=4.7", "numpy", "pillow"]

[project.scripts]
projfit = "projfit.cli:main"

[tool.setuptools]
packages = ["projfit"]
